[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "adrpy-ai"
dynamic = ["version"]
description = "ADR lifecycle CLI for humans and AI agents alike -- JSON-only, no wizard, zero dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Fernando Cerqueira" },
]
keywords = ["adr", "architecture-decision-records", "cli", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/FRACerqueira/adrpy-ai"
Repository = "https://github.com/FRACerqueira/adrpy-ai"
Issues = "https://github.com/FRACerqueira/adrpy-ai/issues"
Changelog = "https://github.com/FRACerqueira/adrpy-ai/blob/main/CHANGELOG.md"

[project.scripts]
adrpy = "adrpy.__main__:main"
adrpy-skills = "adrpy.skills.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/adrpy"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/adrpy/_version.py"
