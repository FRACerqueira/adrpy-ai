[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "adrpy-ai"
dynamic = ["version"]
description = "ADR lifecycle CLI for humans and AI agents alike -- JSON-only, no wizard, zero dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Fernando Cerqueira" },
]
keywords = ["adr", "architecture-decision-records", "cli", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/FRACerqueira/adrpy-ai"
Repository = "https://github.com/FRACerqueira/adrpy-ai"
Issues = "https://github.com/FRACerqueira/adrpy-ai/issues"
Changelog = "https://github.com/FRACerqueira/adrpy-ai/blob/main/CHANGELOG.md"

[project.scripts]
adrpy = "adrpy.__main__:main"
adrpy-skills = "adrpy.skills.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's defaults, plus tools/ (the archived agent-eval harness is not a test suite).
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "tools"]

[tool.hatch.build.targets.wheel]
packages = ["src/adrpy"]
# The README's image, not used by the package: kept in the sdist only.
exclude = ["src/adrpy/icon.png"]

[tool.hatch.build.targets.sdist]
# Repository-only material: CI workflows, this project's own decision log and the archived
# real-agent evaluation harness (tools/agent-eval).
exclude = [".github/", "doc/decision-log/", "tools/"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/adrpy/_version.py"
